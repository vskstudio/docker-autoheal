x-unhealthy: &unhealthy
  image: alpine
  network_mode: none
  restart: "no"
  healthcheck:
    test: exit 1
    interval: 3s
    timeout: 1s
    retries: 1
    start_period: 2s
  command: tail -f /dev/null

services:
  should-keep-restarting:
    <<: *unhealthy
    labels:
      - "${AUTOHEAL_CONTAINER_LABEL}=true"

  shouldnt-restart-healthy:
    <<: *unhealthy
    labels:
      - "${AUTOHEAL_CONTAINER_LABEL}=true"
    healthcheck:
      test: exit 0
      interval: 2s
      timeout: 1s
      retries: 1
      start_period: 1s

  shouldnt-restart-no-label:
    <<: *unhealthy

  shouldnt-restart-opted-out:
    <<: *unhealthy
    labels:
      - "${AUTOHEAL_CONTAINER_LABEL}=true"
      - "autoheal=false"

  autoheal:
    build:
      context: ../
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: "${AUTOHEAL_CONTAINER_LABEL}"
      AUTOHEAL_INTERVAL: "2"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    network_mode: none
